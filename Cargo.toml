[workspace]
resolver = "3"
members = [
    "crates/ks-core",
    "crates/ks-platform",
    "crates/ks-data",
    "crates/ks-macos",
    "crates/ks-windows",
    "crates/ks-linux",
    "crates/ks-app",
    "crates/ks-settings",
    "crates/ks-eval",
    "tools/ks-datagen",
]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.99"
publish = false

# Весь набор внешних крейтов объявлен здесь один раз; крейты берут их через `workspace = true`.
# Сетевой клиент (ureq) подключается только к tools/ks-datagen.
[workspace.dependencies]
ks-core = { path = "crates/ks-core" }
ks-platform = { path = "crates/ks-platform" }
ks-data = { path = "crates/ks-data" }
ks-macos = { path = "crates/ks-macos" }
ks-windows = { path = "crates/ks-windows" }
ks-linux = { path = "crates/ks-linux" }
ks-settings = { path = "crates/ks-settings" }

# общее
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1"
thiserror = "2.0"
anyhow = "1.0"
directories = "6.0"
log = "0.4"
env_logger = "0.11"
fst = "0.4"
flate2 = "1.1"

# macOS
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
block2 = "0.6"
dispatch2 = "0.3"
core-foundation = "0.10"
core-graphics = "0.25"

# Windows
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
] }

# Linux (xkbcommon-dl грузит libxkbcommon через dlopen: системная библиотека не нужна при сборке)
evdev = "0.13"
x11rb = { version = "0.14", features = ["xkb"] }
zbus = "5"
ksni = "0.3"
xkbcommon-dl = "0.4"

# трей и меню macOS/Windows (на Linux tray-icon тянет GTK — там ksni)
tray-icon = "0.26"
muda = "0.21"
tao = "0.37"

notify = "8"
eframe = "0.36"
# растры значка трея (уже в дереве через tray-icon)
png = "0.18"

# только tools/ks-datagen
ureq = "3"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package.miniz_oxide]
opt-level = 3
